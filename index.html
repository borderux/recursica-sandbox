<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursica Sandbox</title>
    <script>
      // Check if the current path matches a Storybook build folder
      function checkForStorybookBuild() {
        const path = window.location.pathname;
        const pathSegments = path.split('/').filter((segment) => segment);

        // Site is served from the domain root (sandbox.recursica.com), not
        // https://<owner>.github.io/recursica-sandbox/ — so paths here are
        // already root-relative and need no repo-name prefix stripped.

        // If we're at the root, serve the main app (do nothing, let it load)
        if (pathSegments.length === 0) {
          return;
        }

        // Check if the first segment matches a build folder
        const buildFolder = pathSegments[0];
        const buildPath = `/builds/${buildFolder}/index.html`;

        // Try to fetch the build's index.html to see if it exists
        fetch(buildPath, { method: 'HEAD' })
          .then((response) => {
            if (response.ok) {
              // Build exists, redirect to it
              window.location.href = buildPath;
            }
            // If build doesn't exist, stay on the main app
          })
          .catch(() => {
            // Error occurred, stay on the main app
          });
      }

      // Run the check when the page loads
      checkForStorybookBuild();
    </script>
    <script type="module" crossorigin src="./assets/main-69UPo5dc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-Cq9sfs6c.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
